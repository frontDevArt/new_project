# Окружение для отладки: всё локально, в сеть ходим только за курсом и лентой.
# Секретов здесь нет и быть не должно — только ссылки ${VAR} на переменные из .env.
env: dev

storage:
  kind: local                   # local | gdrive
  directory: ./data/remote      # «удалённое» хранилище при отладке
  work_dir: ./data              # куда кладётся рабочая копия базы на время прогона
  db_filename: listam.sqlite
  keep_backups: 5               # сколько прежних копий базы держим в хранилище
  max_shrink_percent: 10        # насколько база может усохнуть без --allow-shrink
  busy_timeout_ms: 10000        # сколько ждать, пока чужая запись отпустит базу
  lock_stale_seconds: 10800     # замок прогона старше этого считается брошенным

locale:
  timezone: Asia/Yerevan        # человеческое время: расписание, шапка дайджеста

schedule:                       # `python -m listam schedule install` ставит задачи отсюда
  log_dir: ./data/logs          # лог каждого цикла: по расписанию вывод иначе пропадает
  keep_logs_days: 14
  task_prefix: listam-dev       # имя задач в schtasks, метка в crontab: не пересекается с prod
  alert_on_failure: true        # упавший шаг — одна строка брокеру в чат
  alert_every_hours: 6          # и не чаще этого
  linux_xvfb: true              # на Linux цикл заворачивается в xvfb-run -a
  cycles:                       # шаги — аргументы CLI без «python -m listam»; первый ненулевой код — стоп
                                # «в ЧЧ:30», а не «:00»: часовой идёт в начале часа, и занятый им
                                # замок тихо пропустил бы ночной обход или вечерний дайджест
    hourly:  {every_minutes: 60, steps: ["scrape --fresh", "match --new", "notify --hot"]}
    nightly: {at: "04:30", steps: ["scrape", "match --all", "notify --feed"]}
    evening: {at: "20:30", steps: ["notify --digest"]}

validate:                       # пороги «это опечатка продавца, а не данные»
  price_usd: {min: 5000, max: 5000000}
  price_per_sqm: {min: 100, max: 20000}
  area: {min: 5, max: 2000}
  min_area_per_room: 8          # метров на комнату: меньше — опечатка в площади

coverage:                       # доли заполненности полей: уехавшую вёрстку видно сразу
  min_sample: 100               # на меньшем числе карточек доля ничего не значит
  min_filled:                   # доля карточек, где поле не пустое
    title: 0.99
    price_raw: 0.95
    district: 0.98
  min_share:                    # доля карточек с конкретным значением поля
    seller_type: {agency: 0.05}

requests:
  kind: csv                     # none | csv | gsheet
  path: ./data/requests.csv     # для kind: csv; папка data не коммитится,
                                # образец таблицы — config/requests.example.csv
  # sheet: ${REQUESTS_SHEET}          # для kind: gsheet
  # credentials_file: ${GDRIVE_CREDENTIALS_FILE}
  # range: A1:Z1000                   # сколько строк листа читаем

match:                          # движок подбора: `python -m listam match`
  weights:                      # веса факторов, сумма значения не имеет
                                # названы обязаны быть все шесть: имя с опечаткой
                                # и пропущенный фактор — отказ на входе, а не
                                # молча другой балл. Выключают фактор весом 0
    budget: 30                  # попадание в бюджет
    district: 20                # район: приоритетный выше просто допустимого
    price_per_sqm: 20           # выгодность против медианы района
    area_rooms: 15              # площадь и комнаты
    floor: 10                   # штраф за первый и последний, если клиент против
    seller_type: 5              # собственник выше агентства
  thresholds:
    hot: 70                     # немедленное уведомление (заработает на M3)
    digest: 40                  # дневной дайджест
  budget_stretch_percent: 10    # на столько растягиваем бюджет, если заявка молчит
  cluster:
    area_tolerance: 2           # м²: на столько могут разойтись обмеры одной квартиры
  limit: 50                     # сколько строк показывает `matches`; 0 и
                                # отрицательное — отказ кодом 2, без потолка — null

export:
  kind: xlsx_local
  path: ./out
  matches_limit: 200            # строк на заявку в листе «Матчи»; 0 и
                                # отрицательное — отказ кодом 2, без потолка — null

changes:                        # витрина дельты: `python -m listam changes`
  limit: 50                     # сколько строк показывать в каждом разделе; 0 и
                                # отрицательное — отказ кодом 2, без потолка — null
  fallback_hours: 24            # за сколько часов считать, если журнал прогонов пуст

rate:
  kind: rate_am                 # rate_am | fixed
  # amd_per_usd: 363.25         # используется только при kind: fixed

notify:
  kind: stdout                  # none | stdout | telegram
  # token: ${TELEGRAM_BOT_TOKEN}      # для kind: telegram
  # chat_id: ${TELEGRAM_CHAT_ID}      # чат брокера: клиентам он пересылает сам
  layout:                       # вёрстка по пункту 8 docs/анализ-после-M3.md
    score_green: 80             # 🟢 от этого балла; 🟡 — от match.thresholds.hot, ниже — ⚪
  hot:                          # «звони сейчас»: раз в час, после match --new
    enabled: true
    per_request: 5              # строк на заявку; порог балла — match.thresholds.hot
    fallback_hours: 2           # окно, когда отправок ещё не было
  digest:                       # «посмотри вечером»: раз в сутки
    enabled: true
    per_request: 10             # строк на заявку; порог — match.thresholds.digest
    wide_request: 15            # событий больше — заявка помечается как слишком широкая
    include_retired: true       # тихий раздел «отпало»: куда делась вчерашняя карточка
    fallback_hours: 24
  feed:                         # что пришло на ленту вне заявок
    enabled: false              # тумблер: от заявок не зависит вовсе
    limit: 15                   # строк 💎 в сообщении, самые выгодные сверху
    gem_percent: 15             # 💎 — дешевле медианы района хотя бы на столько процентов
    fallback_hours: 24

scrape:
  kind: playwright                 # playwright — через браузер; http — голые запросы; files — с диска
  pages_dir: ./data/pages       # откуда берутся страницы при kind: files
  base_url: https://www.list.am/ru
  category: 60                  # продажа квартир
  min_cards_per_page: 20        # страница отдала меньше — считаем сбоем и встаём
  max_cards_per_page: 120       # страница отдала больше — в разбор попала не лента
  hard_page_limit: 1000         # потолок обхода: зацикленный пагинатор не крутит вечно
  delay_seconds: 1.5            # пауза между запросами, никаких параллельных пачек
  max_pages: null               # полный обход категории, до конца ленты
  fresh_stop_after_known_pages: 2   # столько страниц подряд без новых — и хватит
  fresh_max_pages: 20               # потолок инкрементального обхода
  expected_pages_min: null      # обход короче — сбой; null — проверки нет
  max_pages_drop_percent: 20    # на столько процентов обход может быть короче прошлого удачного
  max_gone_percent: 10          # больше этой доли пропало с ленты — не помечаем, это сбой
  timeout_seconds: 45           # браузер медленнее голого запроса
  retries: 3
  # --- только для kind: playwright ---
  headless: false               # true Cloudflare отличает и режет; на сервере — xvfb-run
  browser_channel:              # пусто — chromium из playwright; chrome — системный Chrome
  profile_dir: ./data/browser   # профиль браузера: кука cf_clearance переживает перезапуск
  challenge_wait_seconds: 25    # сколько ждём, пока проверка Cloudflare отработает
